# ═════════════════════════════════════════════════════════════════════════════
# THIS RUN — Harvard FASRC (Cannon) params template for HVP.
#
# Everything a FASRC run needs is already a default:
#
#   * database paths, tool versions ....... conf/databases/harvard_rc.config
#   * tool modules, queue, resources ...... conf/profiles/harvard_rc.config
#   * every other parameter's default ..... conf/params.config
#
# All three are applied by `-profile harvard_rc`; this file overrides them, and
# the command line overrides this. Copy it when you want a run written down:
#
#   cp conf/harvard_rc.yaml my-study.yaml
#   nextflow run main.nf -profile harvard_rc -params-file my-study.yaml -w /path/to/output/work
#
# Keep the work directory on shared storage: compute nodes cannot see the login
# node's /tmp, and a work directory there fails every task with exit 127.
# ═════════════════════════════════════════════════════════════════════════════

### Input and output — the two settings every run needs

# readsdir: "/path/to/your/fastqs"
# outdir:   "/path/to/output"

### Which components run (names: conf/components.json, or `--help components`)

# components: "kneaddata,baqlava,assembly"    # the default: everything that is ready
# plugin: "genomad"                           # or: one component on its own

### Library layout — detected from filenames; override only if needed

# single_end:      true
# pair_identifier: "_R{1,2}"

### baqlava component

# baqlava_humann: false              # skip HUMAnN
# baqlava_bypass_depletion: true     # only for tiny samples (0 prescreen species)

### kneaddata component — non-human host

# host_genome: "/n/lab_storage/huttenhower_lab/data/kneaddata_databases/mouse_C57BL"

### assembly component

# megahit_min_contig_length: 2500
# sgb_completeness:          50
# sgb_contamination:         10
