# ═════════════════════════════════════════════════════════════════════════════
# THIS RUN — Tufts HPC params template.
#
# The counterpart to conf/harvard_rc.yaml, and the same shape: only the settings
# that belong to one run. `-profile tufts_hpc` already supplies
#
#   * database paths, tool versions ....... conf/databases/tufts.config
#   * executor, queue, Apptainer .......... conf/profiles/tufts_hpc.config
#   * every other parameter's default ..... conf/params.config
#
# and `--flag value` on the command line overrides whatever is set here.
#
#   nextflow run /path/to/main.nf -profile tufts_hpc \
#     --readsdir /path/to/fastqs --outdir /path/to/output -w /path/to/output/work
#
# The Tufts stack is MetaPhlAn 4 (mpa_vJun23) with HUMAnN 3.7, and the tools are
# expected on PATH or in a container -- unlike harvard_rc, the profile loads no
# modules. Only the mgx and mtx workflows have been exercised here; the assembly
# workflow additionally needs phylophlan_path, and mtx needs host_transcriptome
# and rrna_db, none of which are set for this site yet.
# ═════════════════════════════════════════════════════════════════════════════

### Input and output

# readsdir: "/path/to/your/fastqs"
# outdir:   "/path/to/output"

### Which workflow

# mgx (default) | mtx | mgx_mtx | 16s | vis | stats | assembly | phanta
# workflow: "mgx"

### Library layout

# Paired-end is detected from the read filenames and is the default.
# single_end:      true
# pair_identifier: "_R{1,2}"

### Databases this site has not set yet

# Needed by --workflow mtx and by the mtx half of mgx_mtx:
# host_transcriptome: "/cluster/tufts/bonhamlab/shared/databases/kneaddata/transcriptome"
# rrna_db:            "/cluster/tufts/bonhamlab/shared/databases/kneaddata/SILVA_128_LSUParc_SSUParc_ribosomal_RNA_v0.2"

# Needed by --workflow assembly:
# phylophlan_path: "/cluster/tufts/bonhamlab/shared/databases/phylophlan"

# Needed by --workflow phanta. Tufts is deferred for Phanta -- AWS is the first
# target and FASRC the second -- so neither the ~25 GB database nor the
# container has been staged here. The profile already enables Apptainer, so
# bringing Phanta up should be a container directive plus these two values.
# phanta_db:                         "/cluster/tufts/bonhamlab/shared/databases/phanta"
# phanta_db_expected_inspect_sha256: "<sha256 of phanta_db/inspect.out>"

### Optional stages (all default to off)

# run_viral_profiling: true
# run_strain_profiling: true

### Phanta workflow

# Phanta profiles the gut virome alongside bacteria, archaea and eukaryotes,
# and is selected with --workflow phanta. It is the one workflow that takes a
# SAMPLESHEET instead of readsdir, because the merged tables' sample column
# order follows the samplesheet and filename globbing cannot express an order.
#
# So the Library layout settings above -- paired_end, single_end, filepattern,
# pair_identifier -- DO NOT APPLY to Phanta. Layout comes from whether a row
# has a fastq_2 value, and the whole cohort must be the same.
#
# The samplesheet is a CSV with this exact header:
#   sample,fastq_1,fastq_2
# Leave fastq_2 empty for single-end samples. To convert Phanta's own
# tab-delimited sample file: bin/phanta_convert_samplesheet.py
#
# phanta_samplesheet: "/path/to/samples.csv"

# Thresholds. These are upstream Phanta's defaults; the asymmetry is deliberate,
# since a spurious hit covers a far larger fraction of a small viral genome than
# of a bacterial one. Both the coverage and the minimizer threshold must be
# passed for a species to be kept.
# phanta_cov_thresh_viral:     0.10
# phanta_cov_thresh_bacterial: 0.01
# phanta_cov_thresh_arc:       0.01
# phanta_cov_thresh_euk:       0

# read_length must match a Bracken distribution the database actually ships
# (databaseNmers.kmer_distrib); a mismatch is reported before any Kraken2 task.
# phanta_read_length:   150
# phanta_filter_thresh: 10
# phanta_confidence:    0.1

# Keep the stable per-sample intermediates as well as the four cohort tables.
# Nothing is ever deleted either way -- this only controls what is published.
# save_intermediate: false
