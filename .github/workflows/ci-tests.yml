# What can be checked without the bioBakery tool stack.
#
# The integration suite (tests/run_tests.sh) needs the tools, the reference
# databases and a SLURM cluster, so it cannot run here; see tests/README.md.
# What runs here instead:
#   * bin/make_diagrams.py --check: the component registry, the component
#     files, the orchestrator and the generated docs all agree;
#   * `nextflow run -preview` for several component selections. -preview
#     resolves the configuration, validates the params against
#     nextflow_schema.json and builds the graph without launching a task, so it
#     catches a broken include, a channel wired to nothing, or a component that
#     does not compile -- including every placeholder.

name: CI

on: [push, pull_request]

jobs:
  graph:
    name: Workflow graphs and docs are current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '24.10.4'

      - name: Check every profile parses
        run: |
          for profile in local harvard_rc tufts_hpc amazon; do
            echo "== -profile $profile"
            nextflow config -profile "$profile" > /dev/null
          done

      - name: Check no profile has deleted a resource request
        run: bin/check_profile_resources.py

      - name: Check the registry, the code and the generated docs agree
        run: bin/make_diagrams.py --check

      - name: Build the graph for each component selection
        run: |
          stubs="--host_genome /stub/hg38 --metaphlan_db /stub/metaphlan --humann_db /stub/humann --phylophlan_path /stub/phylophlan"
          all=$(python3 -c "import json; print(','.join(c['name'] for c in json.load(open('conf/components.json'))['components']))")
          # A handler error (e.g. in workflow.onComplete) is logged but does not
          # change the exit status, so fail on any ERROR line as well.
          preview() {
            echo "== $*"
            nextflow run main.nf -preview --outdir preview $stubs "$@" 2>&1 | tee preview.log
            test "${PIPESTATUS[0]}" -eq 0
            if grep -q "ERROR" preview.log; then echo "ERROR in preview output"; exit 1; fi
          }
          preview --readsdir tests/data/rawfastq
          preview --readsdir tests/data/single_end_rawfastq --single_end true --components kneaddata,baqlava
          preview --readsdir tests/data/rawfastq --components baqlava
          preview --readsdir tests/data/rawfastq --plugin genomad
          preview --readsdir tests/data/rawfastq --components "$all"

      - name: An unknown component is refused
        run: |
          if nextflow run main.nf -preview --readsdir tests/data/rawfastq --components nope > out.log 2>&1; then
            echo "accepted --components nope"; exit 1
          fi
          grep -q "nope" out.log
