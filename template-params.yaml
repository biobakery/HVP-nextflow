### Data type

# paired end data
paired_end: true

filepattern: "*_R{1,2}*.fastq.gz" 
# filepattern: "*.fastq.gz" 

### Metaphlan version
# metaphlan3.1.0 params
# metaphlan_version : "metaphlan_v3"
# metaphlan4 params
metaphlan_version : "metaphlan_v4"

# humann3.7 params
# humann_version : "humann_v37"
# humann4alpha params
humann_version : "humann_v4a"

### Computing environment

